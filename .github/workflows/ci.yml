name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.10"
  PYTHON_VERSION: "3.12"
  # The shipped artefacts, shared by several jobs. Kept here so a change to one
  # of them is a single edit rather than five.
  FIT: examples/fit.jsonl.gz
  CONTROL: examples/control.jsonl.gz
  BASELINE: examples/baseline.json

jobs:
  quality:
    name: Lint, format, types, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev --group docs

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      - name: Build the documentation site
        # The builder fails on a broken internal link, so a renamed page fails
        # the pull request rather than shipping a 404.
        run: uv run --only-group docs python scripts/build_site.py --output _site

  test:
    name: Tests (${{ matrix.layer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every marker declared in pyproject.toml. A layer that exists and is
        # never selected is a layer nobody runs.
        layer: [unit, integration, security, e2e, meta]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: pytest -m ${{ matrix.layer }}
        # Bare, with no coverage flag: a matrix leg that inherited the coverage
        # gate would fail on every leg but the full one, for a reason that has
        # nothing to do with the layer it is reporting on.
        run: uv run pytest -m ${{ matrix.layer }} -v

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --group dev

      - name: Full suite with the coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=88

  gates:
    name: The gateway measures itself
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: doctor
        # Proves the installation works end to end, and re-runs the replay
        # determinism check before anything downstream depends on it.
        run: uv run amg doctor

      - name: The committed workloads still match their plans
        # Catches a workload regenerated by a different build, or edited by
        # hand -- which is the fastest way to make a baseline pass.
        #
        # Not "regenerate and git diff": that compares bytes, and gzip carries
        # header fields no consumer reads. This compares the digest over the
        # task fields.
        #
        # Every command after the first also re-asserts disjointness. The
        # control and the shifted workloads are generated with the fitting
        # corpus excluded, and a control that quietly overlaps the workload the
        # router was fitted on reports optimism as generalisation.
        run: |
          uv run amg check --plan fit --corpus "$FIT"
          uv run amg check --plan measure --corpus "$CONTROL" --disjoint-from "$FIT"
          for share in 10 50 70 90; do
            uv run amg check --plan "shift-$share" \
              --corpus "examples/shift-$share.jsonl.gz" --disjoint-from "$FIT"
          done

      - name: The routing experiment and the resilience sweep, gated
        # Replays six workloads under five policies, computes McNemar's exact
        # test against the spend-matched null, and sweeps two fault models at
        # three arms and two capacities. Fails on a correctness regression, a
        # cost increase, a shrinking advantage over the null, a workload or
        # policy that appeared or vanished, or a fall in the recorded
        # resilience figures.
        #
        # It also refuses to publish at all if the replay does not reproduce,
        # which exits 2 rather than printing a number that looks exactly like a
        # measurement and is a different one each run.
        run: |
          uv run amg evaluate \
            --corpus "$FIT" \
            --control "$CONTROL" \
            --shift examples/shift-10.jsonl.gz \
            --shift examples/shift-50.jsonl.gz \
            --shift examples/shift-70.jsonl.gz \
            --shift examples/shift-90.jsonl.gz \
            --baseline "$BASELINE" \
            --with-resilience \
            --json-out reports/evaluation.json \
            --markdown-out reports/evaluation.md \
            --junit-out reports/evaluation.xml

      - name: The gates fire when the gateway gets worse
        # Breaks one thing at a time against the shipped binary and fails if
        # the exit code comes back green: an edited workload, a missing one, a
        # baseline naming an arm this run did not measure, and the two policy
        # refusals. A gate nobody has watched go red is a gate nobody knows the
        # exit code of.
        run: uv run python scripts/check-gateway.py

      - name: Publish the summary
        if: always()
        run: cat reports/evaluation.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports
          path: reports/
          if-no-files-found: error

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked

      - name: Run every example
        # They are documentation that executes. One that stops working is a
        # README that lies.
        run: |
          uv run python examples/quickstart.py
          uv run python examples/routing_holdout_demo.py
          uv run python examples/resilience_demo.py

  build:
    name: Distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build the wheel and sdist
        run: uv build

      - name: The wheel installs and its console script works
        # Building is not the same as being installable. This catches a missing
        # package directory or a broken entry point, which a source checkout
        # never notices because the source directory is importable anyway.
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/amg --version
          /tmp/verify/bin/amg models > /dev/null
